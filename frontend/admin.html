<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · BetPawa Predictor</title>
<style>
:root{--bg:#071019;--panel:#101a25;--panel2:#0b141e;--line:#243446;--txt:#f7f9fc;--muted:#9db0c3;--accent:#b8ef4c;--green:#63e29a;--amber:#ffd166;--red:#ff8181}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:32px;font-weight:950}.btn{border:1px solid var(--line);background:#172536;color:var(--txt);border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}.btn.primary{background:var(--accent);color:#11180a;border-color:var(--accent)}.btn.danger{background:#2a1417;color:var(--red)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:var(--accent);color:#11180a}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}.stat b{font-size:24px;display:block}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted)}input,select{background:#0b141e;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}.form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.good{background:#102619;color:var(--green)}.bad{background:#2a1417;color:var(--red)}.pending{background:#2b250e;color:var(--amber)}.hidden{display:none}.strategy{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;margin:8px 0}.strategy h4{margin:0 0 5px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">Admin Console</div><div class="muted">Private strategies, clients and subscriptions</div></div><div><a class="btn" href="/client">Client view</a> <button class="btn" onclick="logout()">Sign out</button></div></div>
<div class="tabs"><button class="btn active" data-tab="overview">Overview</button><button class="btn" data-tab="clients">Clients</button><button class="btn" data-tab="requests">Requests</button><button class="btn" data-tab="strategies">Strategies</button><button class="btn" data-tab="security">Security</button></div>
<section id="overview" class="tab panel"><div id="stats" class="grid"></div></section><section id="clients" class="tab panel hidden"><h3>Create client</h3><div class="form"><input id="newUser" placeholder="Username"><input id="newName" placeholder="Display name"><select id="newPlan"><option value="">No plan</option></select><button class="btn primary" onclick="createClient()">Create client</button></div><div id="tempPass" class="muted"></div><div style="overflow:auto"><table><thead><tr><th>Client</th><th>Plan</th><th>Expires</th><th>Status</th><th>Grant/extend</th></tr></thead><tbody id="clientRows"></tbody></table></div></section>
<section id="requests" class="tab panel hidden"><div style="overflow:auto"><table><thead><tr><th>Client</th><th>Requested</th><th>Plan</th><th>Status</th><th>Action</th></tr></thead><tbody id="requestRows"></tbody></table></div></section>
<section id="strategies" class="tab panel hidden"><div class="form"><input id="strategySearch" placeholder="Filter league, market, ID..." oninput="renderStrategies()"></div><div id="strategyList"></div></section>
<section id="security" class="tab panel hidden"><h3>Admin password</h3><div class="form"><input id="currentPassword" type="password" placeholder="Current password"><input id="newPassword" type="password" placeholder="New password"><button class="btn primary" onclick="changePassword()">Change</button></div></section>
</main><script>
let state={clients:[],requests:[],strategies:[],plans:[],me:null};async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.querySelector('#'+b.dataset.tab).classList.remove('hidden')});const fmt=d=>d?new Date(d).toLocaleString():'—';
async function load(){try{const me=await api('/api/auth/me');if(me.account.role!=='admin'){location.href='/client';return}state.me=me.account;const [c,r,s,p]=await Promise.all([api('/api/admin/clients'),api('/api/admin/subscription-requests'),api('/api/admin/strategies'),api('/api/plans')]);state.clients=c.clients;state.requests=r.requests;state.strategies=s.strategies;state.plans=p.plans;newPlan.innerHTML='<option value="">No plan</option>'+state.plans.map(x=>'<option value="'+x.code+'">'+x.label+'</option>').join('');stats.innerHTML='<div class="stat"><b>'+c.clients.length+'</b><span class="muted">Clients</span></div><div class="stat"><b>'+c.clients.filter(x=>x.subscription.is_active).length+'</b><span class="muted">Active subscriptions</span></div><div class="stat"><b>'+r.requests.filter(x=>x.status==='pending').length+'</b><span class="muted">Pending requests</span></div><div class="stat"><b>'+s.strategies.length+'</b><span class="muted">Private strategies</span></div>';renderClients();renderRequests();renderStrategies()}catch(e){location.href='/login'}}
function renderClients(){clientRows.innerHTML=state.clients.map(c=>'<tr><td><b>'+c.display_name+'</b><br><span class="muted">@'+c.username+'</span></td><td>'+c.subscription.plan_label+'</td><td>'+fmt(c.subscription.expires_at)+'</td><td><span class="pill '+(c.subscription.is_active?'good':'bad')+'">'+(c.subscription.is_active?'ACTIVE':'INACTIVE')+'</span></td><td><select id="plan-'+c.id+'">'+state.plans.map(p=>'<option value="'+p.code+'">'+p.label+'</option>').join('')+'<option value="custom">Custom</option></select> <input id="days-'+c.id+'" style="width:85px" type="number" min="1" placeholder="days"> <button class="btn primary" onclick="grant('+c.id+')">Grant</button> <button class="btn danger" onclick="revoke('+c.id+')">Revoke</button></td></tr>').join('')}
function renderRequests(){requestRows.innerHTML=state.requests.map(r=>'<tr><td>'+r.display_name+'<br><span class="muted">@'+r.username+'</span></td><td>'+fmt(r.requested_at)+'</td><td>'+r.plan_code+'</td><td><span class="pill '+(r.status==='pending'?'pending':r.status==='approved'?'good':'bad')+'">'+r.status.toUpperCase()+'</span></td><td>'+(r.status==='pending'?'<button class="btn primary" onclick="review('+r.id+',true)">Approve</button> <button class="btn danger" onclick="review('+r.id+',false)">Reject</button>':'')+'</td></tr>').join('')}
function renderStrategies(){const q=(strategySearch.value||'').toLowerCase();strategyList.innerHTML=state.strategies.filter(s=>JSON.stringify(s).toLowerCase().includes(q)).map(s=>'<div class="strategy"><h4>'+s.strategy_name+' <span class="pill good">'+s.strategy_family+'</span></h4><div class="code">'+s.rule_id+'</div><div>'+s.league+' · '+s.market+' · '+(s.win_rate*100).toFixed(2)+'% ('+s.wins+'/'+s.tests+')</div><div class="muted">Trigger: '+s.trigger+'</div><div class="muted">Baseline '+(s.baseline*100).toFixed(2)+'% · Edge '+s.edge_pp+'pp · Positive seasons '+(s.positive_seasons||'—')+'</div></div>').join('')}
async function createClient(){try{const d=await api('/api/admin/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:newUser.value,display_name:newName.value,plan_code:newPlan.value||null})});tempPass.textContent='Temporary password for '+d.account.username+': '+d.temporary_password+' — copy it now.';await load()}catch(e){alert(e.message)}}async function grant(id){const plan=document.querySelector('#plan-'+id).value;const days=Number(document.querySelector('#days-'+id).value||0);try{await api('/api/admin/clients/'+id+'/subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan_code:plan,custom_days:plan==='custom'?days:null})});await load()}catch(e){alert(e.message)}}async function revoke(id){if(!confirm('Revoke this subscription?'))return;await api('/api/admin/clients/'+id+'/subscription/revoke',{method:'POST'});await load()}async function review(id,approve){await api('/api/admin/subscription-requests/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approve})});await load()}async function changePassword(){try{await api('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:currentPassword.value,new_password:newPassword.value})});alert('Password changed.');currentPassword.value='';newPassword.value=''}catch(e){alert(e.message)}}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}load();
</script></body></html>
