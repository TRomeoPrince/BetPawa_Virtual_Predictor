<!doctype html><html lang="en"><head>
<script src="/bpv-themes.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Personal sign-in — BetPawa Predictor</title><style>body{font:16px system-ui,Segoe UI,sans-serif;background:#f5f9f1;color:#173c2b;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}.card{background:#fff;border:1px solid #d5e5d3;border-radius:18px;padding:30px;max-width:510px;width:100%;box-shadow:0 12px 32px #143b2810}input[type=password]{display:block;width:100%;box-sizing:border-box;padding:12px;margin:9px 0 16px;border:1px solid #bacbb8;border-radius:8px}button{border:0;border-radius:10px;background:#17694c;color:white;padding:13px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}small{color:#64796d}.error{color:#ad3143}label{font-size:14px;font-weight:600}.check{display:flex;gap:9px;align-items:flex-start}.check input{margin-top:3px}</style><link rel="stylesheet" href="/bpv-themes.css">
</head><body><main class="card"><h1>Personal sign-in</h1><p id="status">Signing you in with your private link…</p><p id="error" class="error" role="alert"></p><a href="/login">Use your username and password instead</a></main><script>
const raw=location.hash.slice(1);history.replaceState(null,'','/access');
let token='';try{token=decodeURIComponent(raw)}catch(e){}
(async()=>{
 if(!token){document.getElementById('status').textContent='No link provided.';return}
 try{
  const response=await fetch('/api/auth/link-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token})});
  token='';
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.detail||'Sign-in link invalid.');
  location.replace('/client');
 }catch(error){document.getElementById('status').textContent='Sign-in unsuccessful.';document.getElementById('error').textContent=error.message}
})();
</script></body></html>
