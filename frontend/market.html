<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetPawa Predictor</title>
<style>
:root{--bg:#071019;--panel:#101a25;--panel2:#0b141e;--line:#243446;--txt:#f7f9fc;--muted:#9db0c3;--green:#63e29a;--accent:#b8ef4c;--amber:#ffd166;--red:#ff8181}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:800}.nav a.active{background:var(--accent);color:#11180a;border-color:var(--accent)}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:clamp(32px,5vw,48px)}.sub{color:var(--muted);line-height:1.5;margin-top:7px;max-width:720px}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--accent);font-weight:900}.hero,.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.button{background:var(--accent);color:#11180a;border:0;border-radius:12px;padding:12px 17px;font-size:15px;font-weight:900;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.secondary{background:#172536;color:var(--txt);border:1px solid var(--line)}.meta{color:var(--muted);font-size:13px;line-height:1.5}.ok{color:var(--green)}.error{color:var(--red);font-weight:800}.overview,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{display:block;font-size:20px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px}.card h3{margin:0}.fixture{font-size:19px;font-weight:900;margin:9px 0}.market{color:var(--green);font-weight:900}.rate{font-size:26px;font-weight:950;color:var(--green)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.outcome{font-size:12px;font-weight:900;border-radius:999px;padding:5px 8px;display:inline-block;margin-top:6px}.WON{background:#102619;color:var(--green)}.LOST{background:#2a1417;color:var(--red)}.PENDING{background:#2b250e;color:var(--amber)}.empty{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}@media(max-width:760px){.grid,.overview,.stats{grid-template-columns:1fr}.wrap{padding:16px}}
</style>
</head>
<body><main class="wrap">
<nav class="nav">
  <a href="/">Markets</a>
  <a href="/overs" data-page="overs">Overs</a>
  <a href="/unders" data-page="unders">Unders</a>
  <a href="/btts" data-page="btts">BTTS</a>
  <a href="/wins" data-page="wins">Wins</a>
</nav>

<div class="top">
  <div><h1 id="title">Market</h1><div id="subtitle" class="sub"></div></div>
  <div class="badge">v0.3.4</div>
</div>

<section class="hero">
  <button id="go" class="button">Check predictions</button>
  <span id="msg" class="meta" style="margin-left:9px">Only this market will be shown here.</span>
  <div id="overview" class="overview" style="display:none"></div>
</section>

<section class="section">
  <div class="sectionHead"><h2 id="currentTitle">Current predictions</h2><span id="count" class="meta"></span></div>
  <div id="predictions" class="grid"><div class="empty">Press the button above to check this market.</div></div>
</section>

<section class="section">
  <div class="sectionHead"><h2>Last result</h2><button id="refresh" class="button secondary">Refresh results</button></div>
  <div id="last"><div class="empty">No saved result for this market yet.</div></div>
</section>

<section class="section">
  <h2>Your results</h2>
  <div id="stats" class="stats"></div>
  <div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Matchday</th><th>Result</th><th>Win rate</th><th>Pending</th></tr></thead><tbody id="history"></tbody></table></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const page=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
const config={
  overs:{title:'OVERS',button:'Check Overs',desc:'Goal-over predictions only.'},
  unders:{title:'UNDERS',button:'Check Unders',desc:'Goal-under predictions only.'},
  btts:{title:'BTTS',button:'Check BTTS',desc:'Both Teams To Score predictions only.'},
  wins:{title:'WINS',button:'Check Wins',desc:'Home-win and away-win predictions only.'}
};
const cfg=config[page]||config.overs;
document.title=cfg.title+' · BetPawa Predictor';
$('#title').textContent=cfg.title;
$('#subtitle').textContent=cfg.desc;
$('#go').textContent=cfg.button;
$('#currentTitle').textContent='Current '+cfg.title+' predictions';
document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===page));

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';
async function json(url,opt){const r=await fetch(url,opt);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={detail:t}};if(!r.ok)throw new Error(d.detail||t||r.statusText);return d}

function predictionCard(p){
  const detail=(p.top_wins!=null&&p.top_tests!=null)?(p.top_wins+'/'+p.top_tests+' historical tests'):'Validated historical pattern';
  const support=p.support_count>1?(' · '+p.support_count+' private supports'):'';
  return '<div class="card"><div class="row"><h3>'+esc(p.league)+'</h3><div class="rate">'+pct(p.top_historical_win_rate)+'</div></div><div class="fixture">'+esc(p.target_home)+' - '+esc(p.target_away)+'</div><div class="market">'+esc(p.expected)+'</div><div class="meta" style="margin-top:7px">'+esc(detail)+esc(support)+'</div></div>';
}

function renderHistory(h){
  h=h||{};
  const o=h.overall||{};
  $('#stats').innerHTML=
    '<div class="stat"><b>'+Number(o.wins||0)+'</b><span class="meta">Wins</span></div>'+
    '<div class="stat"><b>'+Number(o.losses||0)+'</b><span class="meta">Losses</span></div>'+
    '<div class="stat"><b>'+pct(o.win_rate)+'</b><span class="meta">Win rate</span></div>'+
    '<div class="stat"><b>'+Number(o.pending||0)+'</b><span class="meta">Pending</span></div>';

  const b=h.last_completed_batch||h.last_batch;
  if(!b){
    $('#last').innerHTML='<div class="empty">No saved result for this market yet.</div>';
  }else if(!(b.predictions||[]).length){
    $('#last').innerHTML='<div class="empty">The latest saved request had no '+esc(cfg.title)+' candidates.</div>';
  }else{
    $('#last').innerHTML='<div class="grid">'+b.predictions.map(p=>{
      const score=p.outcome==='PENDING'?'Awaiting result':(p.ft_home+' - '+p.ft_away);
      return '<div class="card"><div class="row"><div><h3>'+esc(p.league)+'</h3><span class="outcome '+esc(p.outcome)+'">'+esc(p.outcome)+'</span></div><div class="rate">'+esc(score)+'</div></div><div class="fixture">'+esc(p.target_home)+' - '+esc(p.target_away)+'</div><div class="market">'+esc(p.expected)+'</div></div>';
    }).join('')+'</div>';
  }

  const batches=h.recent_batches||[];
  $('#history').innerHTML=batches.length?batches.map(b=>{
    const r=b.graded?(b.wins+'/'+b.graded+' won'):(b.candidate_count?'Pending':'No candidates');
    return '<tr><td>Season '+esc(b.season)+' · MD'+esc(b.matchday)+'</td><td>'+esc(r)+'</td><td>'+pct(b.win_rate)+'</td><td>'+Number(b.pending||0)+'</td></tr>';
  }).join(''):'<tr><td colspan="4" class="meta">No history for this market yet.</td></tr>';
}

async function loadHistory(){
  try{renderHistory(await json('/api/history/'+page))}
  catch(e){$('#last').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

async function run(){
  const b=$('#go'),m=$('#msg');
  b.disabled=true;m.textContent='Checking '+cfg.title+'…';
  try{
    const x=await json('/api/predict/'+page,{method:'POST'});
    const perf=x.performance||{};
    m.innerHTML='<span class="ok">Complete in '+Number(perf.seconds||0).toFixed(2)+'s</span>';
    $('#overview').style.display='grid';
    $('#overview').innerHTML=
      '<div class="stat"><b>'+esc(x.season)+'</b><span class="meta">Season</span></div>'+
      '<div class="stat"><b>'+esc(x.latest_completed_matchday)+'</b><span class="meta">Latest completed MD</span></div>'+
      '<div class="stat"><b>'+esc(x.next_matchday)+'</b><span class="meta">Next MD</span></div>'+
      '<div class="stat"><b>'+x.predictions.length+'</b><span class="meta">'+esc(cfg.title)+' picks</span></div>';
    $('#count').textContent=x.predictions.length+' pick'+(x.predictions.length===1?'':'s');
    $('#predictions').innerHTML=x.predictions.length?x.predictions.map(predictionCard).join(''):'<div class="empty">No '+esc(cfg.title)+' candidate triggered for the next matchday.</div>';
    renderHistory(x.personal);
  }catch(e){m.innerHTML='<span class="error">'+esc(e.message)+'</span>'}
  finally{b.disabled=false}
}

async function refresh(){
  const b=$('#refresh');b.disabled=true;b.textContent='Refreshing…';
  try{
    const h=await json('/api/history/'+page+'/refresh',{method:'POST'});
    renderHistory(h);
    b.textContent=h.refresh&&h.refresh.graded_now?'Results updated':'Results checked';
  }catch(e){b.textContent='Refresh failed'}
  finally{setTimeout(()=>{b.textContent='Refresh results';b.disabled=false},1400)}
}

$('#go').onclick=run;
$('#refresh').onclick=refresh;
loadHistory();
</script>
</body></html>
