<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · BetPawa Predictor</title><style>
:root{--bg:#071019;--panel:#101a25;--line:#243446;--txt:#f7f9fc;--muted:#9db0c3;--accent:#b8ef4c;--red:#ff8181}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#132437 0,#071019 45%);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:rgba(16,26,37,.96);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px #0007}.brand{font-weight:950;font-size:28px}.sub{color:var(--muted);line-height:1.5;margin:8px 0 24px}.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b141e;color:var(--txt);font-size:15px}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#101708;font-weight:950;font-size:15px;cursor:pointer}.error{color:var(--red);font-weight:800;margin-top:12px}.note{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
</style></head><body><main class="card"><div class="brand">BetPawa Predictor</div><div class="sub">Sign in to your prediction dashboard.</div>
<form id="form"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Sign in</button><div id="error" class="error"></div></form>
<div class="note">Predictions are based on historical patterns and are not guarantees.</div>
<script>const form=document.querySelector('#form'),err=document.querySelector('#error');form.onsubmit=async e=>{e.preventDefault();err.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=d.detail||'Sign in failed.';return}location.href=d.account.role==='admin'?'/admin':'/client';};</script>
</main></body></html>
